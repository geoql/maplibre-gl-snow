packages:
  - example

overrides:
  # Nuxt 4.5+ runs on unhead v3. Keep one copy on the release that fixed the
  # Cloudflare preset build break (nuxt/nuxt#35670).
  unhead: '>=3.4.3'

peerDependencyRules:
  allowedVersions:
    # Vite+ resolves vitest's `vite` peer to @voidzero-dev/vite-plus-core (its
    # Vite 8 fork, versioned 1.x). Nuxt keeps the real vite 8 for the demo.
    vite: '*'

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false
  unrs-resolver: true
  vue-demi: false
  workerd: true
